<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>deepPaper</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="/vendor/katex/dist/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/reader.mjs"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="deepPaper library">deep<span>Paper</span></a>
    <button id="back-library" class="back-library" type="button" hidden>Library</button>
    <div id="filename" class="filename" title=""></div>
    <label class="button open" for="file" tabindex="0">Add PDF</label>
    <input id="file" type="file" accept="application/pdf,.pdf" class="visually-hidden" tabindex="-1">
  </header>

  <main id="library" class="library" aria-label="Paper library">
    <aside class="folders" aria-label="Folders">
      <div class="folder-heading">
        <h2>Folders</h2>
        <button id="new-folder" type="button">New folder</button>
      </div>
      <nav id="folder-list" aria-label="Library folders"></nav>
    </aside>
    <section class="library-papers" aria-labelledby="library-title">
      <header class="library-heading">
        <div>
          <h1 id="library-title">All papers</h1>
          <p id="library-count"></p>
        </div>
        <div id="folder-actions" class="library-actions" hidden>
          <button id="rename-folder" type="button">Rename folder</button>
          <button id="delete-folder" type="button">Remove folder</button>
        </div>
      </header>
      <p id="library-status" role="status"></p>
      <div id="paper-list" class="paper-list"></div>
      <div id="library-empty" class="library-empty" hidden>
        <p>No papers here yet.</p>
        <button id="choose" class="primary" type="button">Add a PDF</button>
      </div>
    </section>
  </main>

  <main id="reader-window" class="workspace" hidden>
    <section class="reader" aria-label="PDF reader">
      <div class="toolbar" id="toolbar" hidden>
        <div class="group tool-switch" role="group" aria-label="Reader tool">
          <button id="select-tool" type="button" title="Text selection (V)" aria-pressed="true">Select</button>
          <button id="hand-tool" type="button" title="Drag to pan (Space)" aria-pressed="false">Hand</button>
        </div>
        <div class="group" aria-label="Page navigation">
          <button id="prev" type="button" title="Previous page" aria-label="Previous page">‹</button>
          <label class="visually-hidden" for="page-number">Page number</label>
          <input id="page-number" type="number" min="1" value="1">
          <span id="page-total"></span>
          <button id="next" type="button" title="Next page" aria-label="Next page">›</button>
        </div>
        <div class="group zoom" aria-label="Zoom controls">
          <button id="zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button" title="Fit page width" aria-label="Fit page width">Fit</button>
          <button id="zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
        </div>
      </div>

      <div class="reader-body">
        <div id="pdf-scroll" tabindex="0" aria-label="PDF pages" hidden>
          <div id="viewer" class="pdfViewer"></div>
        </div>
        <div id="empty" class="empty">
          <div class="upload">
            <div class="paper-icon" aria-hidden="true"><span></span></div>
            <h1>Opening PDF…</h1>
          </div>
        </div>
        <div id="selection-actions" class="selection-actions" role="group" aria-label="Selected passage" hidden>
          <button id="highlight" type="button" title="Toggle highlight (H)">Highlight</button>
          <div id="highlight-colors" role="group" aria-label="Highlight colors"></div>
          <button id="note-selection" type="button" title="Add a note (N)">Add note</button>
          <button id="ask-selection" type="button" title="Ask about selection (A)">Ask AI</button>
        </div>
        <div class="toast" id="reader-status" role="status" hidden></div>
      </div>
    </section>

    <div id="chat-splitter" class="chat-splitter" role="separator" tabindex="0" aria-label="Resize chat pane"
         aria-controls="reading-sidebar" aria-orientation="vertical" title="Drag to resize chat. Double-click to reset."></div>
    <aside id="reading-sidebar" class="reading-sidebar" aria-label="Paper tools">
      <div class="tabs" role="tablist" aria-label="Paper tools">
        <button type="button" id="ask-tab" role="tab" aria-selected="true" aria-controls="ask-panel">Ask AI</button>
        <button type="button" id="notes-tab" role="tab" aria-selected="false" aria-controls="notes-panel" tabindex="-1">Notes <span id="note-count"></span></button>
      </div>

      <section id="ask-panel" class="panel" role="tabpanel" aria-labelledby="ask-tab">
        <div class="session-toolbar">
          <button id="toggle-sessions" type="button" aria-expanded="false" aria-controls="session-panel">Show sessions</button>
          <span id="current-session" class="current-session"></span>
          <button id="new-session" type="button">New session</button>
        </div>
        <div id="session-panel" class="session-panel" aria-label="Reading sessions" hidden>
          <ul id="session-list"></ul>
        </div>
        <button id="ask-reply-selection" class="selection-actions" type="button" hidden>Ask about this</button>
        <div id="messages" class="messages" aria-label="Conversation">
          <div id="ask-empty" class="ask-empty">
            <h2>Ask about the paper</h2>
            <p>Ask about the whole paper or select a passage.</p>
            <button id="summary" type="button" hidden>Summarize this paper</button>
          </div>
        </div>
        <form id="ask-form" class="composer">
          <span id="chat-status" role="status" class="visually-hidden"></span>
          <div id="scope" class="scope" hidden>
            <div class="scope-heading">
              <span id="scope-title"></span>
              <button type="button" id="clear-scope">Clear</button>
            </div>
            <blockquote id="scope-text"></blockquote>
          </div>
          <label class="visually-hidden" for="question">Your question</label>
          <textarea id="question" rows="2" maxlength="4000" enterkeyhint="send" placeholder="Ask about the paper…" aria-describedby="composer-shortcuts" disabled required></textarea>
          <div class="composer-actions">
            <label class="visually-hidden" for="provider">Model provider</label>
            <select id="provider" disabled><option>Connecting…</option></select>
            <label class="visually-hidden" for="mode">Reading mode</label>
            <select id="mode" aria-label="Reading mode">
              <option value="explain">Explain</option>
              <option value="critique">Critique</option>
              <option value="brainstorm">Brainstorm</option>
            </select>
            <button id="send" class="primary" type="submit" disabled>Send</button>
            <button id="stop" class="stop-reply" type="button" hidden>Stop</button>
          </div>
          <div id="composer-shortcuts" class="composer-shortcuts">Enter to send · Shift+Enter for a new line</div>
        </form>
      </section>

      <section id="notes-panel" class="panel notes-panel" role="tabpanel" aria-labelledby="notes-tab" hidden>
        <div class="notes-header">
          <h2>Highlights &amp; notes</h2>
          <button id="new-note" type="button" disabled>New note</button>
        </div>
        <div id="notes-list" class="notes-list">
          <form id="note-form" class="note-card note-editor" hidden>
            <h3 id="note-heading">New note</h3>
            <p id="note-context"></p>
            <label class="visually-hidden" for="note-text">Note text</label>
            <textarea id="note-text" rows="4" maxlength="8000" placeholder="Write your note…"></textarea>
            <p id="note-status" role="status"></p>
            <div class="dialog-actions">
              <button id="cancel-note" type="button">Cancel</button>
              <button id="save-note" class="primary" type="submit">Save note</button>
            </div>
          </form>
          <div id="note-cards"></div>
        </div>
      </section>
    </aside>
  </main>

  <dialog id="folder-dialog" aria-labelledby="folder-dialog-title">
    <form id="folder-form">
      <h2 id="folder-dialog-title">New folder</h2>
      <p id="folder-dialog-detail" hidden></p>
      <label id="folder-name-label" for="folder-name">Folder name</label>
      <input id="folder-name" type="text" maxlength="120">
      <p id="folder-dialog-status" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-folder" type="button">Cancel</button>
        <button id="save-folder" type="submit" class="primary">Create folder</button>
      </div>
    </form>
  </dialog>

  <dialog id="diagram-dialog" aria-labelledby="diagram-title">
    <header>
      <h2 id="diagram-title">Diagram</h2>
      <form method="dialog"><button type="submit" aria-label="Close diagram">Close</button></form>
    </header>
    <div class="diagram-display"></div>
  </dialog>

</body>
</html>
